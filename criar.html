<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Criar Conta - AgroGestor+</title>


    <style>

        /* =====================================================
           CONFIGURAÇÃO GERAL
           ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #eeeeee;
            color: #222;
            overflow: hidden;
        }


        /* =====================================================
           PÁGINA
           ===================================================== */

        .pagina {
            width: 100%;
            max-width: 430px;
            height: 100vh;
            min-height: 650px;

            margin: 0 auto;

            background: #ffffff;

            position: relative;
            overflow: hidden;

            display: flex;
            flex-direction: column;
        }


        /* =====================================================
           CONTEÚDO
           ===================================================== */

        .conteudo {
            width: 100%;
            height: calc(100% - 105px);

            padding: 10px 22px 0;

            position: relative;
            z-index: 3;

            display: flex;
            flex-direction: column;

            overflow: hidden;
        }


        /* =====================================================
           VOLTAR
           ===================================================== */

        .voltar {
            width: fit-content;

            display: flex;
            align-items: center;

            gap: 8px;

            color: #398b2d;

            text-decoration: none;

            font-size: 16px;
            font-weight: 500;

            line-height: 22px;

            flex-shrink: 0;
        }


        .icone-voltar {
            width: 22px;
            height: 22px;

            display: flex;
            align-items: center;
            justify-content: center;

            flex-shrink: 0;
        }


        .icone-voltar svg {
            width: 22px;
            height: 22px;

            stroke: #398b2d;
            fill: none;

            stroke-width: 2.2;

            stroke-linecap: round;
            stroke-linejoin: round;
        }


        /* =====================================================
           LOGO
           ===================================================== */

        .logo-area {
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-top: 1px;

            flex-shrink: 0;
        }


        .logo {
            width: 145px;
            height: auto;

            display: block;
        }


        /* =====================================================
           TÍTULO
           ===================================================== */

        .titulo {
            width: 100%;

            text-align: center;

            color: #056522;

            font-size: 32px;
            font-weight: 800;

            line-height: 1;

            margin-top: 2px;

            flex-shrink: 0;
        }


        /* =====================================================
           SUBTÍTULO
           ===================================================== */

        .subtitulo {
            width: 100%;

            text-align: center;

            color: #777777;

            font-size: 15px;
            font-weight: 400;

            line-height: 1.2;

            margin-top: 5px;

            flex-shrink: 0;
        }


        /* =====================================================
           FORMULÁRIO
           ===================================================== */

        .formulario {
            width: 100%;

            display: flex;
            flex-direction: column;

            gap: 5px;

            margin-top: 11px;

            flex-shrink: 0;
        }


        /* =====================================================
           CAMPOS
           ===================================================== */

        .campo {
            width: 100%;
            height: 43px;

            border: 2px solid #d8d8d8;
            border-radius: 11px;

            background: #ffffff;

            display: flex;
            align-items: center;

            padding: 0 12px;

            flex-shrink: 0;
        }


        /* =====================================================
           ÍCONE DOS CAMPOS
           ===================================================== */

        .icone-campo {
            width: 27px;
            height: 27px;

            margin-right: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            flex-shrink: 0;
        }


        .icone-campo svg {
            width: 25px;
            height: 25px;

            stroke: #398b2d;
            fill: none;

            stroke-width: 1.9;

            stroke-linecap: round;
            stroke-linejoin: round;
        }


        /* =====================================================
           INPUT
           ===================================================== */

        .campo input {
            width: 100%;
            height: 100%;

            border: none;
            outline: none;

            background: transparent;

            color: #333333;

            font-family: Arial, Helvetica, sans-serif;

            font-size: 15px;
        }


        .campo input::placeholder {
            color: #777777;
            opacity: 1;
        }


        /* =====================================================
           SENHA
           ===================================================== */

        .campo-senha {
            padding-right: 8px;
        }


        .botao-olho {
            width: 29px;
            height: 29px;

            border: none;
            background: transparent;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            flex-shrink: 0;
        }


        .botao-olho svg {
            width: 24px;
            height: 24px;

            stroke: #398b2d;
            fill: none;

            stroke-width: 1.8;

            stroke-linecap: round;
            stroke-linejoin: round;
        }


        /* =====================================================
           BOTÃO CADASTRAR
           ===================================================== */

        .botao-cadastrar {
            width: 100%;
            height: 50px;

            margin-top: 4px;

            border: none;
            border-radius: 12px;

            background: #07852f;

            color: #ffffff;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 10px;

            font-family: Arial, Helvetica, sans-serif;

            font-size: 19px;
            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 4px 10px rgba(0, 80, 30, 0.15);

            flex-shrink: 0;
        }


        .botao-cadastrar:active {
            transform: scale(0.98);
        }


        .icone-cadastrar {
            width: 31px;
            height: 31px;

            display: flex;
            align-items: center;
            justify-content: center;

            flex-shrink: 0;
        }


        .icone-cadastrar svg {
            width: 30px;
            height: 30px;

            stroke: #ffffff;
            fill: none;

            stroke-width: 1.7;

            stroke-linecap: round;
            stroke-linejoin: round;
        }


        /* =====================================================
           ÁREA DA FAZENDA
           ===================================================== */

        .fazenda-area {
            width: 100%;
            height: 105px;

            position: absolute;

            left: 0;
            bottom: 0;

            overflow: hidden;

            z-index: 1;
        }


        /* =====================================================
           IMAGEM DA FAZENDA
           ===================================================== */

        .fazenda {
            position: absolute;

            left: 0;
            bottom: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;
            object-position: center bottom;

            display: block;
        }


        /* =====================================================
           CURVA BRANCA
           ===================================================== */

        .curva {
            position: absolute;

            top: -31px;
            left: -5%;

            width: 110%;
            height: 58px;

            background: #ffffff;

            border-radius: 50%;

            z-index: 2;
        }


        /* =====================================================
           CELULARES
           ===================================================== */

        @media (max-width: 600px) {

            .pagina {
                min-height: 650px;
            }


            .conteudo {
                height: calc(100% - 100px);

                padding: 9px 22px 0;
            }


            .voltar {
                font-size: 16px;
            }


            .icone-voltar,
            .icone-voltar svg {
                width: 21px;
                height: 21px;
            }


            .logo {
                width: 140px;
            }


            .titulo {
                font-size: 31px;
            }


            .subtitulo {
                font-size: 15px;
            }


            .formulario {
                margin-top: 10px;
                gap: 5px;
            }


            .campo {
                height: 42px;
            }


            .icone-campo {
                width: 26px;
                height: 26px;

                margin-right: 9px;
            }


            .icone-campo svg {
                width: 24px;
                height: 24px;
            }


            .campo input {
                font-size: 14px;
            }


            .botao-olho {
                width: 28px;
                height: 28px;
            }


            .botao-olho svg {
                width: 23px;
                height: 23px;
            }


            .botao-cadastrar {
                height: 49px;

                font-size: 18px;
            }


            .fazenda-area {
                height: 100px;
            }

        }


        /* =====================================================
           CELULARES COM TELA MENOR
           ===================================================== */

        @media (max-height: 700px) {

            .conteudo {
                height: calc(100% - 88px);

                padding-top: 7px;
            }


            .logo {
                width: 115px;
            }


            .titulo {
                font-size: 28px;
            }


            .subtitulo {
                font-size: 14px;

                margin-top: 3px;
            }


            .formulario {
                margin-top: 7px;

                gap: 4px;
            }


            .campo {
                height: 38px;
            }


            .icone-campo {
                width: 24px;
                height: 24px;
            }


            .icone-campo svg {
                width: 22px;
                height: 22px;
            }


            .campo input {
                font-size: 13px;
            }


            .botao-olho {
                width: 26px;
                height: 26px;
            }


            .botao-olho svg {
                width: 21px;
                height: 21px;
            }


            .botao-cadastrar {
                height: 44px;

                font-size: 17px;

                margin-top: 3px;
            }


            .icone-cadastrar {
                width: 28px;
                height: 28px;
            }


            .icone-cadastrar svg {
                width: 27px;
                height: 27px;
            }


            .fazenda-area {
                height: 88px;
            }

        }


        /* =====================================================
           TELAS MUITO PEQUENAS
           ===================================================== */

        @media (max-width: 360px) and (max-height: 700px) {

            .conteudo {
                padding-left: 18px;
                padding-right: 18px;
            }


            .logo {
                width: 108px;
            }


            .titulo {
                font-size: 27px;
            }


            .subtitulo {
                font-size: 13px;
            }


            .campo {
                height: 37px;
            }


            .formulario {
                gap: 4px;
            }


            .botao-cadastrar {
                height: 43px;
            }


            .fazenda-area {
                height: 85px;
            }

        }

    </style>

</head>


<body>


<div class="pagina">


    <!-- =====================================================
         CONTEÚDO PRINCIPAL
         ===================================================== -->

    <main class="conteudo">


        <!-- =================================================
             VOLTAR
             ================================================= -->

        <a
            href="../Página inicial 2/inicio.html"
            class="voltar"
        >

            <span class="icone-voltar">

                <svg
                    viewBox="0 0 24 24"
                >

                    <polyline
                        points="15 18 9 12 15 6"
                    ></polyline>

                </svg>

            </span>


            <span>
                Voltar
            </span>

        </a>


        <!-- =================================================
             LOGO
             ================================================= -->

        <div class="logo-area">

            <img
                src="AgroGestor.png"
                alt="Logo AgroGestor+"
                class="logo"
            >

        </div>


        <!-- =================================================
             TÍTULO
             ================================================= -->

        <h1 class="titulo">
            Criar Conta
        </h1>


        <!-- =================================================
             SUBTÍTULO
             ================================================= -->

        <p class="subtitulo">
            Preencha os dados abaixo para<br>
            criar sua conta.
        </p>


        <!-- =================================================
             FORMULÁRIO
             ================================================= -->

        <form
            class="formulario"
            onsubmit="cadastrar(event)"
        >


            <!-- NOME -->

            <div class="campo">

                <span class="icone-campo">

                    <svg viewBox="0 0 24 24">

                        <circle
                            cx="12"
                            cy="7"
                            r="4"
                        ></circle>

                        <path
                            d="M4 21c0-4.2 3.6-7 8-7s8 2.8 8 7"
                        ></path>

                    </svg>

                </span>


                <input
                    type="text"
                    placeholder="Nome"
                    autocomplete="name"
                    required
                >

            </div>


            <!-- E-MAIL -->

            <div class="campo">

                <span class="icone-campo">

                    <svg viewBox="0 0 24 24">

                        <rect
                            x="3"
                            y="5"
                            width="18"
                            height="14"
                            rx="1"
                        ></rect>

                        <polyline
                            points="3 7 12 14 21 7"
                        ></polyline>

                    </svg>

                </span>


                <input
                    type="email"
                    placeholder="E-mail"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- TELEFONE -->

            <div class="campo">

                <span class="icone-campo">

                    <svg viewBox="0 0 24 24">

                        <path
                            d="M6.5 3.5l3 2.5-2 3c1 2.2 2.3 3.5 4.5 4.5l3-2 2.5 3c.5.6.4 1.5-.2 2l-1.5 1c-.8.5-1.8.7-2.7.4-3.2-1-6-3.2-7.9-6.1-1.9-2.9-2.8-6-2.3-8.2.2-.9.8-1.6 1.6-2l1.5-.8c.7-.4 1.5-.2 2 .4z"
                        ></path>

                    </svg>

                </span>


                <input
                    type="tel"
                    placeholder="Telefone"
                    autocomplete="tel"
                    required
                >

            </div>


            <!-- NOME DA FAZENDA -->

            <div class="campo">

                <span class="icone-campo">

                    <svg viewBox="0 0 24 24">

                        <path
                            d="M3 10.5L12 3l9 7.5"
                        ></path>

                        <path
                            d="M5 9.5V21h14V9.5"
                        ></path>

                        <path
                            d="M9 21v-6h6v6"
                        ></path>

                    </svg>

                </span>


                <input
                    type="text"
                    placeholder="Nome da Fazenda"
                    required
                >

            </div>


            <!-- CIDADE -->

            <div class="campo">

                <span class="icone-campo">

                    <svg viewBox="0 0 24 24">

                        <path
                            d="M12 21s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"
                        ></path>

                        <circle
                            cx="12"
                            cy="9"
                            r="2.2"
                        ></circle>

                    </svg>

                </span>


                <input
                    type="text"
                    placeholder="Cidade"
                    autocomplete="address-level2"
                    required
                >

            </div>


            <!-- SENHA -->

            <div class="campo campo-senha">

                <span class="icone-campo">

                    <svg viewBox="0 0 24 24">

                        <rect
                            x="5"
                            y="10"
                            width="14"
                            height="11"
                            rx="2"
                        ></rect>

                        <path
                            d="M8 10V7a4 4 0 0 1 8 0v3"
                        ></path>

                    </svg>

                </span>


                <input
                    id="senha"
                    type="password"
                    placeholder="Senha"
                    autocomplete="new-password"
                    required
                >


                <button
                    type="button"
                    class="botao-olho"
                    onclick="mostrarSenha('senha', this)"
                >

                    <svg viewBox="0 0 24 24">

                        <path
                            d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"
                        ></path>

                        <circle
                            cx="12"
                            cy="12"
                            r="2.5"
                        ></circle>

                        <line
                            x1="4"
                            y1="4"
                            x2="20"
                            y2="20"
                        ></line>

                    </svg>

                </button>

            </div>


            <!-- CONFIRMAR SENHA -->

            <div class="campo campo-senha">

                <span class="icone-campo">

                    <svg viewBox="0 0 24 24">

                        <rect
                            x="5"
                            y="10"
                            width="14"
                            height="11"
                            rx="2"
                        ></rect>

                        <path
                            d="M8 10V7a4 4 0 0 1 8 0v3"
                        ></path>

                    </svg>

                </span>


                <input
                    id="confirmarSenha"
                    type="password"
                    placeholder="Confirmar Senha"
                    autocomplete="new-password"
                    required
                >


                <button
                    type="button"
                    class="botao-olho"
                    onclick="mostrarSenha('confirmarSenha', this)"
                >

                    <svg viewBox="0 0 24 24">

                        <path
                            d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"
                        ></path>

                        <circle
                            cx="12"
                            cy="12"
                            r="2.5"
                        ></circle>

                        <line
                            x1="4"
                            y1="4"
                            x2="20"
                            y2="20"
                        ></line>

                    </svg>

                </button>

            </div>


            <!-- =================================================
                 BOTÃO CADASTRAR
                 ================================================= -->

            <button
                type="submit"
                class="botao-cadastrar"
            >

                <span class="icone-cadastrar">

                    <svg viewBox="0 0 24 24">

                        <circle
                            cx="9"
                            cy="7"
                            r="4"
                        ></circle>

                        <path
                            d="M2 21c0-4 3-7 7-7s7 3 7 7"
                        ></path>

                        <line
                            x1="18"
                            y1="8"
                            x2="18"
                            y2="16"
                        ></line>

                        <line
                            x1="14"
                            y1="12"
                            x2="22"
                            y2="12"
                        ></line>

                    </svg>

                </span>


                <span>
                    Cadastrar
                </span>

            </button>


        </form>

    </main>


    <!-- =====================================================
         FAZENDA
         ===================================================== -->

    <section class="fazenda-area">

        <div class="curva"></div>


        <img
            src="fazenda.png"
            alt="Ilustração de uma fazenda"
            class="fazenda"
        >

    </section>


</div>


<script>

    /* =====================================================
       MOSTRAR / OCULTAR SENHA
       ===================================================== */

    function mostrarSenha(id, botao) {

        const campo =
            document.getElementById(id);


        if (campo.type === "password") {

            campo.type = "text";

            botao.style.opacity = "0.55";

        } else {

            campo.type = "password";

            botao.style.opacity = "1";

        }

    }


    /* =====================================================
       CADASTRAR
       ===================================================== */

    function cadastrar(event) {

        event.preventDefault();


        const senha =
            document.getElementById("senha").value;


        const confirmar =
            document.getElementById("confirmarSenha").value;


        if (senha !== confirmar) {

            alert("As senhas não são iguais.");

            return;

        }


        window.location.href = "../PAINEL DA PROPRIEDADE /principal.html";

    }

</script>


</body>

</html>
